# backend.quorum.asistentepro.mx — API + documentación MFA  (DRAFT, no aplicado)
#
# Host dedicado para el API y los contratos MFA. Reutiliza el certificado
# wildcard `*.quorum.asistentepro.mx` (/etc/letsencrypt/live/quorum-wildcard).
# El CNAME ya apunta a esta IP; este bloque es lo único que falta.
#
# Al aplicar:
#   1) copiar este archivo a la ruta de conf de nginx del host
#   2) copiar apps/api/docs/openapi/ -> /opt/quorum-backoffice/docs/mfa/
#   3) nginx -t && systemctl reload nginx
#
# TODO(issues): servir también /api/ aquí (proxy_pass quorum_backoffice_api_k8s)
# para que "backend" sea el host canónico del API, no solo de los docs.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name backend.quorum.asistentepro.mx;

    ssl_certificate     /etc/letsencrypt/live/quorum-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quorum-wildcard/privkey.pem;

    root /opt/quorum-backoffice/docs;

    # MFA contract docs
    location = /mfa { return 301 /mfa/; }
    location /mfa/ {
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Placeholder para el proxy del API (pendiente de decisión en issue).
    # location /api/ { proxy_pass http://quorum_backoffice_api_k8s; }
}

server {
    listen 80;
    listen [::]:80;
    server_name backend.quorum.asistentepro.mx;
    return 301 https://$host$request_uri;
}
