# /etc/nginx/sites-available/quorum.asistentepro.mx.conf
# Quorum Backoffice — legacy path-prefix mount, **RETIRED 2026-09-23**.
#
# History: prior to 2026-09-23, this file proxied /backoffice/* to Fastify (port 3100)
# + Next.js (port 3002) under the root domain `quorum.asistentepro.mx`.
# As of quorum-nginx-vhosts (D1: delete the path-prefix legacy, no redirect), the
# Backoffice lives at its own dedicated subdomain `backoffice.quorum.asistentepro.mx`
# and the vhost in `quorum/infra/vps-nginx/sites-available/quorum.conf` (main `quorum.conf`).
#
# This file is kept ONLY to:
#   1. Return a tiny HTML pointer at `/` telling visitors where the Backoffice moved.
#   2. Avoid dropping the HTTP→HTTPS redirect (still needed for `/` URLs that
#      hit nginx directly without a Host header).
#
# All `/backoffice/*` proxy locations were removed.
# If you find references to `quorum.asistentepro.mx/backoffice/...` in docs or
# scripts, update them to `https://backoffice.quorum.asistentepro.mx/...`.
#
# See:
#   - /planQuorum/dev/MAPEO_MODS.md (status table)
#   - /planQuorum/dev/quorum/odd/tasks/quorum-nginx-vhosts.md (closure entry)
#   - /planQuorum/dev/quorum/docs/runbooks/nginx-vhosts.md (deploy + rollback)

# HTTP -> HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name quorum.asistentepro.mx;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name quorum.asistentepro.mx;

    # TLS (certbot --nginx populates these).
    ssl_certificate     /etc/letsencrypt/live/quorum.asistentepro.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quorum.asistentepro.mx/privkey.pem;

    # Modern TLS only.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-XSS-Protection "0" always;
    # Don't leak nginx version.
    server_tokens off;

    # Health probes bypass logs.
    access_log off;

    # Root pointer — the root URL (`/`) hosts Jitsi, so serve a tiny HTML
    # page pointing at the Backoffice on its dedicated subdomain.
    location = / {
        add_header Content-Type text/html;
        return 200 '<!doctype html><meta charset=utf-8><title>quorum.asistentepro.mx</title><p>This domain hosts Jitsi at the root and the Quorum Backoffice at <a href="https://backoffice.quorum.asistentepro.mx/">backoffice.quorum.asistentepro.mx</a>.</p>';
    }
}
