# /etc/nginx/sites-available/quorum.asistentepro.mx.conf
# Quorum Backoffice — reverse proxy to Fastify (port 3100) + Next.js (port 3002).
#
# Enable: ln -s /etc/nginx/sites-available/quorum.asistentepro.mx.conf /etc/nginx/sites-enabled/
# TLS:   certbot --nginx -d quorum.asistentepro.mx
# Reload: nginx -t && systemctl reload nginx

# HTTP -> HTTPS redirect (handled by certbot when using --nginx).
server {
    listen 80;
    listen [::]:80;
    server_name quorum.asistentepro.mx;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name quorum.asistentepro.mx;

    # TLS (certbot --nginx populates these).
    ssl_certificate     /etc/letsencrypt/live/quorum.asistentepro.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quorum.asistentepro.mx/privkey.pem;

    # Modern TLS only.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-XSS-Protection "0" always;
    # Don't leak nginx version.
    server_tokens off;

    # Compression.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml application/xml+rss image/svg+xml;

    # Webhook-friendly body size for /api/v1/*.
    client_max_body_size 5m;

    # Health probes bypass logs.
    access_log off;

    # Root pointer — the root URL (`/`) hosts Jitsi, so serve a tiny
    # HTML page pointing at the backoffice mounted under `/backoffice/`.
    location = / {
        add_header Content-Type text/html;
        return 200 '<!doctype html><meta charset=utf-8><title>quorum.asistentepro.mx</title><p>This domain hosts Jitsi at the root and the Quorum Backoffice at <a href="/backoffice/">/backoffice/</a>.</p>';
    }

    # API backend (rewrite strips /backoffice/ before forwarding).
    location /backoffice/api/ {
        rewrite ^/backoffice/api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Health + readiness (also proxied but no logging).
    location ~ ^/backoffice/(healthz|readyz)$ {
        rewrite ^/backoffice/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        access_log off;
    }

    # Metrics — restrict to internal CIDRs (replace with your monitoring subnet).
    location = /backoffice/metrics {
        # Example: allow 10.0.0.0/8 + the monitoring VPC.
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        rewrite ^/backoffice/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3100;
        access_log off;
    }

    # Next.js (catch-all — must be last).
    location /backoffice/ {
        rewrite ^/backoffice/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Static asset caching for Next.js _next/static/* (cache 1y immutable).
    location /backoffice/_next/static/ {
        rewrite ^/backoffice/_next/static/(.*)$ /_next/static/$1 break;
        proxy_pass http://127.0.0.1:3002;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
    }
}