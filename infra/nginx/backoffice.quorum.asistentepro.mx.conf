# Quorum BackOffice — dedicated subdomain vhost.
# The Next.js app is built with basePath=/backoffice and listens on port 4002.
# Keep the existing URL base path; the subdomain root takes visitors to login.

server {
    listen 80;
    listen [::]:80;
    server_name backoffice.quorum.asistentepro.mx;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name backoffice.quorum.asistentepro.mx;

    ssl_certificate /etc/letsencrypt/live/quorum-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quorum-wildcard/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    # Match the shared SSL zone size used by coordinator.conf.
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/backoffice.access.log main;
    error_log /var/log/nginx/backoffice.error.log;

    # The application is mounted at /backoffice in its Next.js build.
    location = / {
        return 302 /backoffice/login;
    }

    # Bare /login (no /backoffice prefix) — same destination as the root,
    # so users that omit the basePath still land on the login page.
    # Mirrors the same-origin API routing below: same upstreams, same TLS.
    location = /login {
        return 302 /backoffice/login;
    }

    # Same-origin API routing: forward /api/v1/... to the Fastify API upstream.
    # Must precede the catch-all web location so /api requests bypass Next.js.
    location /api/ {
        proxy_pass http://quorum_backoffice_api_k8s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://quorum_backoffice_web_k8s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
