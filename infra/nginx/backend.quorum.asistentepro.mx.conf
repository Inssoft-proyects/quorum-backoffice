# Quorum Backend — API + MFA contract docs (mobile handoff).
# Wildcard cert covers the hostname; /api/ mirrors the backoffice API upstream.
#
# NOTE: this vhost is deployed and ACTIVE on the host. To go live at
# https://backend.quorum.asistentepro.mx/mfa/ a public DNS record for
# `backend.quorum.asistentepro.mx` (CNAME -> backoffice.quorum.asistentepro.mx)
# is still required — the hostname does not resolve yet. The same docs are
# served meanwhile at https://backoffice.quorum.asistentepro.mx/mfa/.

server {
    listen 80;
    listen [::]:80;
    server_name backend.quorum.asistentepro.mx;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name backend.quorum.asistentepro.mx;

    ssl_certificate /etc/letsencrypt/live/quorum-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quorum-wildcard/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/backend.access.log main;
    error_log /var/log/nginx/backend.error.log;

    location = / { return 302 /mfa/; }

    # API — same upstream as the backoffice vhost.
    location /api/ {
        proxy_pass http://quorum_backoffice_api_k8s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MFA contract docs (primary).
    location /mfa/ {
        root /opt/quorum-backoffice/docs;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Same Swagger UI under /mfa/api/ for the mobile handoff.
    location /mfa/api/ {
        alias /opt/quorum-backoffice/docs/mfa/;
        index index.html;
    }

    location = /mfa/openapi.yaml { root /opt/quorum-backoffice/docs; add_header Content-Type application/yaml; }
    location = /mfa/api/openapi.yaml { alias /opt/quorum-backoffice/docs/mfa/openapi.yaml; add_header Content-Type application/yaml; }

    location / { return 404; }
}
